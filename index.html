<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAG polymorph XRD</title>
<style>
:root{--bg:#ffffff;--card:#f5f4ef;--text:#1f1f1d;--sub:#5f5e5a;--muted:#888780;--line:#c9c7be;--radius:8px}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#2a2a28;--text:#f1efe8;--sub:#b4b2a9;--muted:#888780;--line:#555450}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:500;margin:4px 0 12px}
canvas{width:100%;display:block}
#cm{height:340px}#cs{height:230px;margin-top:8px}#cx{height:280px;margin-top:8px}
.seg{display:flex;gap:6px;margin:0 0 10px}.seg button{width:auto;padding:0 16px}.seg button.on{background:var(--card);border-color:var(--sub)}
.ctl{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
button{width:52px;height:36px;border:0.5px solid var(--line);background:transparent;color:var(--text);border-radius:var(--radius);font-size:16px;cursor:pointer}
input[type=range]{flex:1}
.lab{display:flex;justify-content:space-between;margin:0 0 12px 62px;font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.m{background:var(--card);border-radius:var(--radius);padding:8px 12px}
.m .k{font-size:12px;color:var(--sub)}.m .v{font-size:18px;font-weight:500}
.note{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1 data-i="title"></h1>
<div class="seg"><button id="bl" style="margin-left:auto;order:2">EN</button><button id="b2" class="on">2L</button><button id="b3">3L</button></div>
<canvas id="cm"></canvas>
<canvas id="cs"></canvas>
<canvas id="cx"></canvas>
<div class="ctl">
<button id="pb" aria-label="Play/pause">❚❚</button>
<input type="range" id="sl" min="0" max="200" step="1" value="0">
</div>
<div class="lab"><span>α</span><span>β′</span><span>β</span></div>
<div class="grid">
<div class="m"><div class="k" data-i="kSub"></div><div class="v" id="vsub">–</div></div>
<div class="m"><div class="k" data-i="kL"></div><div class="v" id="vl">–</div></div>
<div class="m"><div class="k" data-i="kD1"></div><div class="v" id="vd1">–</div></div>
<div class="m"><div class="k" data-i="kD2"></div><div class="v" id="vd2">–</div></div>
</div>
<div class="note" id="note">Cu Kα (1.5406 Å)、PPP相当の値による模式図。格子定数は連続補間（実際の転移は二相共存で進行）。</div>
</div>
<script>
const cm=document.getElementById('cm'),cs=document.getElementById('cs'),cx=document.getElementById('cx'),sl=document.getElementById('sl'),pb=document.getElementById('pb');
const CA='#7F77DD',CB='#1D9E75',CC='#D85A30';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tp=()=>css('--text'),ts=()=>css('--sub'),bd=()=>css('--line');
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
const lam=1.5406,L0=45.6,tth=d=>2*Math.asin(lam/(2*d))*180/Math.PI,lp=(x,y,u)=>x+(y-x)*u;
function mix(x,y,u){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(x),B=p(y);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*u)).join(',')+')';}
function P(s){const o={};if(s<=1){o.a=8.30-0.70*s;o.b=4.79+0.25*s;o.L=L0-3.0*s;const d110=1/Math.sqrt(1/(o.a*o.a)+1/(o.b*o.b)),d200=o.a/2;
o.pk=[{d:d110,I:1},{d:d200,I:0.45+0.15*s},{d:d200,I:0}];o.w=0.32-0.17*s;o.col=mix(CA,CB,s);o.u=0;}
else{const u=s-1;o.u=u;o.a=7.60;o.b=lp(5.04,5.35,u);o.L=lp(42.6,40.6,u);o.pk=[{d:lp(4.20,4.60,u),I:1},{d:lp(3.80,3.87,u),I:lp(0.6,0.45,u)},{d:lp(3.80,3.70,u),I:0.4*u}];o.w=lp(0.15,0.12,u);o.col=mix(CB,CC,u);}
o.tilt=Math.acos(o.L/L0)*180/Math.PI;return o;}
function drawS(s,p){const[g,W,H]=fit(cs);g.clearRect(0,0,W,H);const col=p.col,u=p.u,e=Math.min(s,1);
const w1=W,k=Math.min((w1-50)/8.6,(H-80)/5.5);const cxm=w1/2,cym=H/2,aw=p.a*k,bh=p.b*k,x0=cxm-aw/2,y0=cym-bh/2,sh=u*aw*0.22;
const V=[[x0+sh,y0],[x0+aw+sh,y0],[x0+aw,y0+bh],[x0,y0+bh]];
g.strokeStyle=bd();g.lineWidth=1;g.setLineDash([4,3]);g.beginPath();V.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.closePath();g.stroke();g.setLineDash([]);
const pts=V.map(v=>[v[0],v[1],Math.PI/4*e]);pts.push([cxm+sh/2,cym,-Math.PI/4*e+Math.PI/2*u]);
pts.forEach(([x,y,ang])=>{const R=k*0.95,ry=R*(1-0.6*e);g.save();g.translate(x,y);g.rotate(ang);g.beginPath();g.ellipse(0,0,R,ry,0,0,Math.PI*2);g.fillStyle=col;g.globalAlpha=0.25+0.35*e;g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=1.5;g.setLineDash(s<0.5?[3,2]:[]);g.stroke();g.setLineDash([]);
if(s>0.05){g.beginPath();g.moveTo(-R*0.85,0);g.lineTo(R*0.85,0);g.globalAlpha=e;g.stroke();g.globalAlpha=1;}g.restore();});
g.fillStyle=tp();g.font='13px sans-serif';g.textAlign='left';g.fillText(s<0.15?tr('H'):s<0.85?'H → O⊥':s<1.15?tr('O'):s<1.85?'O⊥ → T∥':tr('T'),8,16);
g.fillStyle=ts();g.textAlign='right';g.fillText(u>0.5?tr('par'):s>0.5?tr('perp'):tr('rot'),W-8,16);
g.textAlign='left';g.fillStyle=ts();g.fillText(tr('subcap'),8,H-4);}
function drawM(s,p){const[g,W,H]=fit(cm);g.clearRect(0,0,W,H);const col=p.col,e=Math.min(s,1),t=p.tilt*Math.PI/180,sT=Math.sin(t),cT=Math.cos(t);
const top=30,bot=H-28,gly=12,len=(bot-top-gly)/2,ym=(top+bot)/2,dc=Math.max(14,Math.min(24,W/30)),amp=2.6*(0.3+0.7*e),xr=W-34;
const hm=gly/2+len*cT;
g.fillStyle=tp();g.font='13px sans-serif';g.textAlign='left';g.fillText(tr('m2'),8,16);
g.strokeStyle=bd();g.lineWidth=1;g.setLineDash([4,3]);[ym-hm,ym+hm].forEach(y=>{g.beginPath();g.moveTo(8,y);g.lineTo(xr,y);g.stroke();});g.setLineDash([]);
g.save();g.beginPath();g.rect(8,top-8,xr-8,bot-top+16);g.clip();
function chain(bx,by,dir,w,a){g.beginPath();const N=15;for(let j=0;j<=N;j++){const f=j/N,o=(j%2?1:-1)*amp*(j>0&&j<N?1:0);const x=bx+dir*sT*len*f+cT*o,y=by-dir*cT*len*f+sT*o;j?g.lineTo(x,y):g.moveTo(x,y);}g.strokeStyle=col;g.globalAlpha=a;g.lineWidth=w;g.stroke();g.globalAlpha=1;}
function mol(x0,flip,a,w,dy){const d=flip?-1:1,yb=ym+dy,C=[[x0,yb],[x0+dc,yb+3*d],[x0+2*dc,yb]],dirs=[d,d,-d];
dirs.forEach((dd,i)=>{const [cx0,cy0]=C[i],sx=cx0,sy=cy0-dd*gly/2;g.beginPath();g.moveTo(cx0,cy0);g.lineTo(sx,sy);g.strokeStyle=ts();g.globalAlpha=a;g.lineWidth=1.2;g.stroke();g.globalAlpha=1;chain(sx,sy,dd,w,a);});
g.beginPath();C.forEach((c,i)=>i?g.lineTo(c[0],c[1]):g.moveTo(c[0],c[1]));g.strokeStyle=ts();g.globalAlpha=a;g.lineWidth=1.6;g.stroke();
C.forEach(c=>{g.beginPath();g.arc(c[0],c[1],2.4,0,Math.PI*2);g.fillStyle=ts();g.fill();});g.globalAlpha=1;return C;}
const span=len*sT+3*dc,m0=Math.floor((8-span)/(3*dc)),m1=Math.ceil((xr+span)/(3*dc));
for(let m=m0;m<=m1;m++)mol(m*3*dc+dc*0.5,true,0.18,1.3,4);
let hl=null;const mc=Math.round((xr/2-dc)/(3*dc));
for(let m=m0;m<=m1;m++){const x=m*3*dc+dc*0.5;if(m===mc)continue;mol(x,false,0.45,1.5,0);}
hl=mol(mc*3*dc+dc*0.5,false,1,2.4,0);g.restore();
g.fillStyle=tp();g.font='11px sans-serif';g.textAlign='center';
[['sn-1',0,1],['sn-2',1,1],['sn-3',2,-1]].forEach(([lb,i,dd])=>{const [cx0,cy0]=hl[i],sy=cy0-dd*gly/2;const tx=cx0+dd*sT*len,ty=sy-dd*cT*len;g.fillText(lb,tx+(i===0?-14:i===1?14:0),ty+(dd>0?-6:14));});
g.strokeStyle=ts();g.lineWidth=1;const ax=W-18;g.beginPath();g.moveTo(ax,ym-hm);g.lineTo(ax,ym+hm);[ym-hm,ym+hm].forEach(y=>{g.moveTo(ax-4,y);g.lineTo(ax+4,y);});g.stroke();
g.save();g.translate(ax+12,ym);g.rotate(-Math.PI/2);g.fillStyle=ts();g.textAlign='center';g.fillText('L = '+p.L.toFixed(1)+' Å',0,0);g.restore();
g.fillStyle=ts();g.textAlign='left';g.font='12px sans-serif';g.fillText(tr('tilt')+' '+p.tilt.toFixed(0)+'°   '+tr('cap2'),8,H-6);}
function drawM3(s,p){const[g,W,H]=fit(cm);g.clearRect(0,0,W,H);const col=p.col,colO='#378ADD',e=Math.min(s,1),t=p.tilt*Math.PI/180,sT=Math.sin(t),cT=Math.cos(t);
const top=30,bot=H-28,gly=10,len=(bot-top-2*gly)/3,ym=(top+bot)/2,dc=Math.max(14,Math.min(24,W/30)),amp=2.4*(0.3+0.7*e),xr=W-34;
const Hr=3*len*cT+2*gly,yT=ym-Hr/2,g2=yT+len*cT+gly/2,g1=g2+gly+len*cT,yB=yT+Hr;
g.fillStyle=tp();g.font='13px sans-serif';g.textAlign='left';g.fillText(tr('m3'),8,16);
g.strokeStyle=bd();g.lineWidth=1;g.setLineDash([4,3]);[yT,yB].forEach(y=>{g.beginPath();g.moveTo(8,y);g.lineTo(xr,y);g.stroke();});g.setLineDash([]);
g.save();g.beginPath();g.rect(8,top-8,xr-8,bot-top+16);g.clip();
function chain(bx,by,dir,w,a,c){g.beginPath();const N=15;for(let j=0;j<=N;j++){const f=j/N,o=(j%2?1:-1)*amp*(j>0&&j<N?1:0);const x=bx+dir*sT*len*f+cT*o,y=by-dir*cT*len*f+sT*o;j?g.lineTo(x,y):g.moveTo(x,y);}g.strokeStyle=c;g.globalAlpha=a;g.lineWidth=w;g.stroke();g.globalAlpha=1;}
function chainO(bx,by,dir,w,a,c,mark){const dl=20*Math.PI/180,l=len/(2*Math.cos(dl)),ang=dir>0?[t+dl,t-dl]:[t-dl,t+dl];let x=bx,y=by;const pts=[[x,y]];let kink=null;
ang.forEach((A,si)=>{const ux=dir*Math.sin(A),uy=-dir*Math.cos(A),nx=Math.cos(A),ny=Math.sin(A),N=8;for(let j=1;j<=N;j++){const o=(j<N)?((j%2?1:-1)*amp):0;pts.push([x+ux*l*j/N+nx*o,y+uy*l*j/N+ny*o]);}x+=ux*l;y+=uy*l;if(si===0)kink=[x,y];});
g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.strokeStyle=c;g.globalAlpha=a;g.lineWidth=w;g.lineJoin='round';g.stroke();
g.beginPath();g.arc(kink[0],kink[1],mark?3.2:2,0,Math.PI*2);g.fillStyle=c;g.fill();g.globalAlpha=1;return kink;}
function mol(x,up,a,w){const d=up?1:-1,yb=up?g2:g1,C1=[x,yb],C3=[x+dc,yb],C2=[x+dc*0.5,yb+3*d],ox=up?x:x+dc,T={};
[[C1,'sn-1'],[C3,'sn-3']].forEach(([c,k])=>{const sy=yb-d*gly/2;g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(c[0],sy);g.strokeStyle=ts();g.globalAlpha=a;g.lineWidth=1.2;g.stroke();g.globalAlpha=1;chain(c[0],sy,d,w,a,col);T[k]=[c[0]+d*sT*len,sy-d*cT*len,d];});
const oy=yb+d*gly/2;g.beginPath();g.moveTo(C2[0],C2[1]);g.lineTo(ox,oy);g.strokeStyle=ts();g.globalAlpha=a;g.lineWidth=1.2;g.stroke();g.globalAlpha=1;T.kink=chainO(ox,oy,-d,w,a,colO,w>2);T['sn-2']=[ox-d*sT*len,oy+d*cT*len,-d];
g.beginPath();[C1,C2,C3].forEach((c,i)=>i?g.lineTo(c[0],c[1]):g.moveTo(c[0],c[1]));g.strokeStyle=ts();g.globalAlpha=a;g.lineWidth=1.6;g.stroke();
[C1,C2,C3].forEach(c=>{g.beginPath();g.arc(c[0],c[1],2.4,0,Math.PI*2);g.fillStyle=ts();g.fill();});g.globalAlpha=1;return T;}
const P2=2*dc,D=len*sT,span=2*len*sT+3*dc,m0=Math.floor((8-span)/P2),m1=Math.ceil((xr+span)/P2),mc=Math.round((xr/2-dc)/P2);
for(let m=m0;m<=m1;m++){mol(m*P2+D,true,0.45,1.5);if(m!==mc)mol(m*P2,false,0.45,1.5);}
const T=mol(mc*P2,false,1,2.4);g.restore();
g.fillStyle=tp();g.font='11px sans-serif';g.textAlign='center';
[['sn-1',-12],['sn-3',12],['sn-2',0]].forEach(([k,dx])=>{const [x,y,d]=T[k];if(y>top-12&&y<bot+12)g.fillText(k,x+dx,y+(d>0?-6:14));});
{const [kx,ky]=T.kink;g.textAlign='left';g.fillStyle=tp();g.fillText('cis C9=C10',kx+8,ky+4);}
g.strokeStyle=ts();g.lineWidth=1;const ax=W-18;g.beginPath();g.moveTo(ax,yT);g.lineTo(ax,yB);[yT,yB].forEach(y=>{g.moveTo(ax-4,y);g.lineTo(ax+4,y);});g.stroke();
g.save();g.translate(ax+12,ym);g.rotate(-Math.PI/2);g.fillStyle=ts();g.textAlign='center';g.fillText('L = '+(p.L*1.5).toFixed(1)+' Å',0,0);g.restore();
g.fillStyle=ts();g.textAlign='left';g.font='12px sans-serif';g.fillText(tr('tilt')+' '+p.tilt.toFixed(0)+'°   '+tr('cap3'),8,H-6);}
function drawX(s,p){const[g,W,H]=fit(cx);g.clearRect(0,0,W,H);const ml=8,mb=30,mt=16,ph=H-mb-mt,gap=16,w1=(W-ml*2-gap)*0.38,w2=(W-ml*2-gap)-w1;
const pan=[{x:ml,w:w1,lo:1,hi:7,lab:'SAXS'},{x:ml+w1+gap,w:w2,lo:18,hi:25,lab:'WAXS'}];
const Ld=mode===3?p.L*1.5:p.L,II=mode===3?[1,0.12,0.4]:[1,0.18,0.1];const sax=[1,2,3].map(l=>({t:tth(Ld/l),I:II[l-1],w:0.07}));const wax=p.pk.map(q=>({t:tth(q.d),I:q.I,w:p.w}));
pan.forEach((q,ix)=>{const pk=ix?wax:sax,f=x=>pk.reduce((a,o)=>a+o.I*Math.exp(-0.5*((x-o.t)/o.w)**2),0);
const N=400,ys=[];let mx=0;for(let i=0;i<=N;i++){const y=f(q.lo+(q.hi-q.lo)*i/N);ys.push(y);mx=Math.max(mx,y);}mx=Math.max(mx,1.05);
g.strokeStyle=bd();g.lineWidth=1;g.beginPath();g.moveTo(q.x,mt+ph);g.lineTo(q.x+q.w,mt+ph);g.stroke();
g.beginPath();ys.forEach((y,i)=>{const X=q.x+q.w*i/N,Y=mt+ph-ph*0.9*y/mx;i?g.lineTo(X,Y):g.moveTo(X,Y);});g.strokeStyle=p.col;g.lineWidth=2;g.stroke();
g.fillStyle=ts();g.font='12px sans-serif';g.textAlign='center';(ix?[19,20,21,22,23,24,25]:[2,4,6]).forEach(v=>g.fillText(v,q.x+q.w*(v-q.lo)/(q.hi-q.lo),mt+ph+15));
g.fillStyle=tp();g.font='13px sans-serif';g.textAlign='left';g.fillText(q.lab,q.x+2,mt+2);
if(!ix){const X=q.x+q.w*(sax[0].t-q.lo)/(q.hi-q.lo);g.fillStyle=ts();g.font='12px sans-serif';g.fillText('(001)',X+5,mt+18);}});
g.fillStyle=ts();g.font='12px sans-serif';g.textAlign='center';g.fillText('2θ (°)',W/2,H-2);}
function render(s){const p=P(s);(mode===3?drawM3:drawM)(s,p);drawS(s,p);drawX(s,p);
document.getElementById('vsub').textContent=s<0.5?tr('H'):s<1.5?tr('O'):tr('T');
document.getElementById('vl').textContent=(mode===3?p.L*1.5:p.L).toFixed(1)+' · '+p.tilt.toFixed(0)+'°';
document.getElementById('vd1').textContent=p.pk[0].d.toFixed(2);
document.getElementById('vd2').textContent=s<0.12?'—':p.pk[2].I>0.05?p.pk[1].d.toFixed(2)+' / '+p.pk[2].d.toFixed(2):p.pk[1].d.toFixed(2);}
let mode=2;const b2=document.getElementById('b2'),b3=document.getElementById('b3'),note=document.getElementById('note');
function setMode(m){mode=m;b2.classList.toggle('on',m===2);b3.classList.toggle('on',m===3);note.textContent=tr(m===3?'note3':'note2');render(cur);}
b2.onclick=()=>setMode(2);b3.onclick=()=>setMode(3);
const I18N={ja:{title:'α → β′ → β：格子定数とXRDパターン',kSub:'サブセル',kL:'長周期 L (Å)・傾き',kD1:'WAXS 主ピーク d (Å)',kD2:'副ピーク d (Å)',
m2:'TAG 分子（chair 型）の 2L ラメラ',m3:'3L ラメラ：飽和鎖と不飽和鎖が別リーフレット',tilt:'鎖の傾き',cap2:'淡色：奥側の反転分子',cap3:'青：sn-2 オレイン鎖（cis 二重結合で屈曲）',
H:'六方晶 H',O:'直方晶 O⊥',T:'三斜晶 T∥',par:'ジグザグ面 平行',perp:'ジグザグ面 直交',rot:'回転無秩序',subcap:'サブセル断面（鎖軸方向から）',
note2:'Cu Kα (1.5406 Å)、PPP相当の値による模式図。格子定数は連続補間（実際の転移は二相共存で進行）。',note3:'SOS型（sn-2 不飽和）の 3L を想定。L は 2L 値×1.5、格子定数は PPP 相当値で連続補間した模式図。',sw:'EN'},
en:{title:'α → β′ → β: lattice parameters and XRD pattern',kSub:'Subcell',kL:'Long spacing L (Å) · tilt',kD1:'WAXS main peak d (Å)',kD2:'Other peaks d (Å)',
m2:'TAG 2L lamella (chair conformation)',m3:'3L lamella: separate sat. / unsat. leaflets',tilt:'Chain tilt',cap2:'Faded: inverted molecules behind',cap3:'Blue: sn-2 oleoyl chain (bent at cis C=C)',
H:'Hexagonal H',O:'Orthorhombic O⊥',T:'Triclinic T∥',par:'Zigzag planes parallel',perp:'Zigzag planes perpendicular',rot:'Rotationally disordered',subcap:'Subcell cross-section (viewed along chain axis)',
note2:'Cu Kα (1.5406 Å), schematic using PPP-like values. Lattice parameters are interpolated continuously (real transitions proceed via two-phase coexistence).',note3:'Assumes an SOS-type TAG (unsaturated at sn-2) in a 3L structure. L is 1.5 × the 2L value; lattice parameters interpolated from PPP-like values (schematic).',sw:'日本語'}};
let lang=(navigator.language||'').startsWith('ja')?'ja':'en';const tr=k=>I18N[lang][k];
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=tr(el.dataset.i));document.getElementById('bl').textContent=tr('sw');document.getElementById('note').textContent=tr(mode===3?'note3':'note2');document.title=lang==='ja'?'TAG 多形 XRD':'TAG polymorph XRD';render(cur);}
const T=12000;let play=true,t0=performance.now(),cur=0;
const sm=v=>v*v*(3-2*v);
function pos(ms){const x=(ms%T)/T;let v=x<0.5?x*2:2-x*2;v=Math.min(1,Math.max(0,(v-0.06)/0.88))*2;const f=Math.floor(Math.min(v,1.999));return f+sm(v-f);}
function loop(now){if(play){cur=pos(now-t0);sl.value=Math.round(cur*100);render(cur);}requestAnimationFrame(loop);}
function setPlay(v){play=v;pb.textContent=play?'❚❚':'▶';}
sl.addEventListener('input',()=>{setPlay(false);cur=sl.value/100;render(cur);});
pb.addEventListener('click',()=>{setPlay(!play);if(play)t0=performance.now()-(0.06+cur/2*0.88)*T/2;});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render(cur));
document.getElementById('bl').onclick=()=>{lang=lang==='ja'?'en':'ja';applyLang();};
addEventListener('resize',()=>render(cur));applyLang();requestAnimationFrame(loop);
</script>
</body>
</html>
